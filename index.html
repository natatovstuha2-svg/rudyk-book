<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Рудик і чарівне світло осені</title>

<style>

:root{
  --night:#130d09;
  --night2:#2b1b12;
  --paper:#f8f2e6;
  --paper2:#eee2cf;
  --ink:#38281d;
  --gold:#e6bb63;
  --goldLight:#ffe3a0;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(255,205,112,.15),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #160f0b,
      #2d1b12 55%,
      #120c08
    );

  overflow-x:hidden;
}

body.locked{
  overflow:hidden;
}

.hidden{
  display:none !important;
}


/* =========================================
   ФОНОВА ОСІНЬ
========================================= */

#autumnLayer{
  position:fixed;
  inset:0;

  overflow:hidden;
  pointer-events:none;

  z-index:5;
}

.fall-leaf{
  position:absolute;
  top:-70px;

  opacity:.38;

  font-family:
    "Segoe UI Emoji",
    "Apple Color Emoji",
    sans-serif;

  filter:
    blur(.1px)
    drop-shadow(0 4px 7px rgba(0,0,0,.18));

  animation:
    leafFall linear forwards;
}

@keyframes leafFall{

  0%{
    transform:
      translate3d(0,0,0)
      rotate(0deg);
  }

  35%{
    transform:
      translate3d(
        calc(var(--drift) * .35),
        38vh,
        0
      )
      rotate(120deg);
  }

  70%{
    transform:
      translate3d(
        calc(var(--drift) * .8),
        78vh,
        0
      )
      rotate(265deg);
  }

  100%{
    transform:
      translate3d(
        var(--drift),
        110vh,
        0
      )
      rotate(390deg);
  }

}


/* =========================================
   ЗОЛОТІ ІСКРИ
========================================= */

.spark{
  position:fixed;

  width:8px;
  height:8px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #fffceb 0%,
      #ffe28a 45%,
      #ffb63e 70%,
      transparent 75%
    );

  box-shadow:
    0 0 8px #fff7c7,
    0 0 18px rgba(255,187,70,.8);

  pointer-events:none;
  z-index:9999;

  animation:
    sparkMove .9s ease-out forwards;
}

@keyframes sparkMove{

  from{
    opacity:1;
    transform:
      translate(0,0)
      scale(1);
  }

  to{
    opacity:0;
    transform:
      translate(
        var(--sx),
        var(--sy)
      )
      scale(.12);
  }

}


/* =========================================
   ОБКЛАДИНКА
========================================= */

.cover-screen{
  position:fixed;
  inset:0;

  z-index:1000;

  display:flex;
  justify-content:center;

  overflow-y:auto;

  padding:
    22px
    18px
    40px;

  background:
    radial-gradient(
      circle at center,
      rgba(255,202,105,.11),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #100b08,
      #25170f
    );

  transition:
    opacity .85s ease,
    visibility .85s ease;
}

.cover-screen.opened{
  opacity:0;
  visibility:hidden;
}

.cover-column{
  width:min(720px,94vw);

  display:flex;
  flex-direction:column;
  align-items:center;

  margin:auto;
}

.cover-book{
  position:relative;

  width:min(670px,90vw);

  aspect-ratio:3/4;

  perspective:1800px;

  filter:
    drop-shadow(
      0 32px 45px
      rgba(0,0,0,.55)
    );
}

.cover-image{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  border-radius:13px;

  transform-origin:left center;

  transition:
    transform .9s
    cubic-bezier(.22,.8,.3,1),
    opacity .75s ease;
}

.cover-book.opening
.cover-image{
  transform:
    perspective(1500px)
    rotateY(-48deg)
    translateX(-5%);

  opacity:.25;
}


/* легкий перелив золота */

.cover-gloss{
  position:absolute;
  inset:0;

  overflow:hidden;
  border-radius:14px;

  pointer-events:none;
}

.cover-gloss::before{
  content:"";

  position:absolute;

  top:-20%;
  left:-45%;

  width:24%;
  height:140%;

  transform:
    rotate(10deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,243,203,.08),
      rgba(255,255,255,.30),
      rgba(255,226,155,.08),
      transparent
    );

  animation:
    coverGlow 7s
    ease-in-out infinite;
}

@keyframes coverGlow{

  0%,
  68%{
    left:-45%;
  }

  100%{
    left:125%;
  }

}


/* невидима зона над листком,
   який уже намальований
   на обкладинці */

.cover-magic-zone{
  position:absolute;

  left:50%;
  top:71%;

  width:110px;
  height:110px;

  transform:
    translate(-50%,-50%);

  border:0;
  border-radius:50%;

  cursor:pointer;

  background:
    radial-gradient(
      circle,
      rgba(255,228,128,.16),
      transparent 68%
    );

  box-shadow:
    0 0 25px
    rgba(255,201,78,.15);

  animation:
    coverLeafPulse
    2.4s ease-in-out infinite;
}

@keyframes coverLeafPulse{

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.10);

    box-shadow:
      0 0 35px
      rgba(255,210,98,.30);
  }

}


/* кнопка ТЕПЕР ПІД КНИГОЮ */

.cover-controls{
  width:100%;

  padding-top:22px;

  text-align:center;
}

.cover-message{
  margin:
    0
    0
    13px;

  color:#f7e4be;

  font-size:15px;

  letter-spacing:.2px;
}

.open-button{
  border:none;

  padding:
    14px
    30px;

  border-radius:999px;

  cursor:pointer;

  font-family:inherit;
  font-size:17px;
  font-weight:700;

  color:#432812;

  background:
    linear-gradient(
      180deg,
      #ffe8aa,
      #d9aa50
    );

  box-shadow:
    0 11px 28px
    rgba(0,0,0,.32),
    inset 0 1px 0
    rgba(255,255,255,.55);

  transition:
    transform .22s ease;
}

.open-button:hover{
  transform:
    translateY(-2px)
    scale(1.02);
}


/* =========================================
   ОСНОВНА КНИГА
========================================= */

.book-app{
  position:relative;
  z-index:10;

  min-height:100vh;

  padding:
    18px
    18px
    30px;
}

.topbar{
  width:min(
    1260px,
    96vw
  );

  margin:
    0 auto
    16px;

  padding:
    13px
    18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  border-radius:18px;

  color:#f9e5bd;

  background:
    rgba(64,39,24,.66);

  backdrop-filter:
    blur(9px);

  border:
    1px solid
    rgba(255,214,139,.12);
}

.book-name{
  font-weight:700;
}

.counter{
  color:#e8ca8c;
  font-size:14px;
}


/* =========================================
   РОЗВОРОТ
========================================= */

.book{
  position:relative;

  width:min(
    1260px,
    96vw
  );

  min-height:730px;

  margin:auto;

  display:grid;
  grid-template-columns:
    1fr
    1fr;

  border-radius:25px;

  overflow:hidden;

  background:#f4ebdb;

  box-shadow:
    0 30px 65px
    rgba(0,0,0,.38);

  perspective:1800px;
}


/* корінець книги */

.book::after{
  content:"";

  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:26px;

  transform:
    translateX(-50%);

  z-index:30;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(74,43,23,.13),
      rgba(0,0,0,.15),
      rgba(255,255,255,.20),
      rgba(0,0,0,.12),
      rgba(73,44,25,.08),
      transparent
    );
}


/* =========================================
   ІЛЮСТРАЦІЯ
========================================= */

.illustration{
  position:relative;

  min-height:730px;

  overflow:hidden;

  background:#1a120d;
}

.scene-image{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  transition:
    transform .7s
    cubic-bezier(.2,.8,.25,1);
}

.scene-image.page-enter{
  animation:
    imageEnter .65s ease;
}

@keyframes imageEnter{

  from{
    opacity:.25;
    transform:scale(1.025);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}


.image-shadow{
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      transparent 65%,
      rgba(20,10,5,.12)
    ),
    linear-gradient(
      0deg,
      rgba(0,0,0,.20),
      transparent 28%
    );
}


/* =========================================
   ОКРЕМИЙ ЧАРІВНИЙ ЛИСТ
========================================= */

.magic-leaf-button{
  position:absolute;

  padding:0;

  border:none;
  outline:none;

  cursor:pointer;

  background:transparent;

  z-index:15;

  transform:
    translate(-50%,-50%)
    rotate(var(--rotation));

  transition:
    left .7s ease,
    top .7s ease,
    width .7s ease,
    opacity .35s ease;
}

.magic-leaf-button.hidden-leaf{
  opacity:0;
  pointer-events:none;
}

.magic-leaf-image{
  width:100%;
  height:auto;

  display:block;

  filter:
    drop-shadow(
      0 0 8px
      rgba(255,235,142,.85)
    )
    drop-shadow(
      0 0 23px
      rgba(255,176,44,.55)
    );

  animation:
    magicLeafBreath
    2.45s ease-in-out
    infinite;
}

@keyframes magicLeafBreath{

  0%,
  100%{
    transform:
      scale(1);
    filter:
      brightness(1)
      drop-shadow(
        0 0 8px
        rgba(255,235,142,.8)
      )
      drop-shadow(
        0 0 20px
        rgba(255,175,42,.48)
      );
  }

  50%{
    transform:
      scale(1.075);

    filter:
      brightness(1.13)
      drop-shadow(
        0 0 15px
        rgba(255,248,190,.95)
      )
      drop-shadow(
        0 0 34px
        rgba(255,169,36,.78)
      );
  }

}

.magic-leaf-button.magic-click
.magic-leaf-image{
  animation:
    leafMagicClick
    .75s ease;
}

@keyframes leafMagicClick{

  0%{
    transform:scale(1);
  }

  35%{
    transform:
      scale(1.22)
      rotate(7deg);
  }

  70%{
    transform:
      scale(.96)
      rotate(-3deg);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================
   ТЕКСТ
========================================= */

.text-page{
  min-height:730px;

  padding:
    clamp(30px,4vw,55px)
    clamp(28px,4vw,60px);

  display:flex;
  flex-direction:column;

  background:
    radial-gradient(
      circle at 32% 15%,
      rgba(255,255,255,.9),
      transparent 31%
    ),
    repeating-linear-gradient(
      0deg,
      rgba(103,78,51,.016)
      0 1px,
      transparent
      1px 4px
    ),
    linear-gradient(
      180deg,
      var(--paper),
      var(--paper2)
    );

  box-shadow:
    inset 12px 0 28px
    rgba(81,49,27,.07);
}

.page-kicker{
  margin:
    0
    0
    10px;

  color:#996a41;

  text-transform:uppercase;

  letter-spacing:1.8px;

  font-size:12px;
}

.scene-title{
  margin:
    0
    0
    20px;

  color:#59391f;

  font-size:
    clamp(
      28px,
      3vw,
      39px
    );

  line-height:1.12;
}

.story{
  color:#3d2c20;

  font-size:
    clamp(
      17px,
      1.5vw,
      20px
    );

  line-height:1.76;
}

.story p{
  margin:
    0
    0
    14px;
}


/* =========================================
   ЗАПИТАННЯ
========================================= */

.questions{
  margin-top:auto;
  padding-top:22px;
}

.questions-card{
  padding:
    17px
    18px;

  border-radius:20px;

  background:
    rgba(255,250,239,.87);

  border:
    1px solid
    rgba(173,126,76,.20);
}

.questions-title{
  margin:
    0
    0
    11px;

  color:#80552f;

  font-size:16px;
}

.questions-list{
  margin:0;

  padding-left:21px;
}

.questions-list li{
  margin:
    8px
    0;

  line-height:1.5;
}


/* =========================================
   МАГІЧНА ПАУЗА
========================================= */

.magic-pause-text{
  margin-top:20px;

  padding:
    14px
    17px;

  border-radius:17px;

  background:
    rgba(255,242,206,.74);

  color:#765027;

  text-align:center;

  font-style:italic;
}


/* =========================================
   НАВІГАЦІЯ
========================================= */

.navigation{
  width:min(
    1260px,
    96vw
  );

  margin:
    18px
    auto
    0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;
}

.nav-button{
  min-width:132px;

  padding:
    13px
    21px;

  border:none;

  border-radius:999px;

  cursor:pointer;

  font-family:inherit;
  font-size:16px;
  font-weight:700;

  color:#492c16;

  background:
    linear-gradient(
      #ffe7aa,
      #deba69
    );

  box-shadow:
    0 9px 19px
    rgba(0,0,0,.18);

  transition:
    transform .2s ease,
    opacity .2s ease;
}

.nav-button:hover:not(:disabled){
  transform:
    translateY(-2px);
}

.nav-button:disabled{
  opacity:.37;
  cursor:default;
}

.dots{
  flex:1;

  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:8px;
}

.dot{
  width:11px;
  height:11px;

  padding:0;

  border:0;
  border-radius:50%;

  cursor:pointer;

  background:
    rgba(255,224,164,.38);

  transition:.2s;
}

.dot.active{
  transform:scale(1.3);

  background:#ffd17b;

  box-shadow:
    0 0 10px
    rgba(255,199,87,.7);
}


/* =========================================
   ПЕРЕГОРТАННЯ
========================================= */

.book.turn{
  animation:
    bookTurn
    .52s ease;
}

@keyframes bookTurn{

  from{
    opacity:.38;

    transform:
      perspective(1600px)
      rotateY(5deg)
      scale(.988);
  }

  to{
    opacity:1;

    transform:
      perspective(1600px)
      rotateY(0)
      scale(1);
  }

}


/* =========================================
   МОБІЛЬНА ВЕРСІЯ
========================================= */

@media(max-width:900px){

  body.locked{
    overflow:auto;
  }

  .cover-screen{
    position:fixed;

    align-items:flex-start;

    padding:
      10px
      10px
      30px;
  }

  .cover-column{
    margin:
      0
      auto;

    width:min(
      560px,
      97vw
    );
  }

  .cover-book{
    width:100%;

    max-height:
      calc(
        100vh - 105px
      );

    aspect-ratio:3/4;
  }

  .cover-image{
    object-fit:contain;
  }

  .cover-controls{
    padding-top:10px;
  }

  .cover-message{
    display:none;
  }

  .open-button{
    padding:
      12px
      26px;
  }


  .book{
    display:block;

    min-height:0;

    border-radius:20px;
  }

  .book::after{
    display:none;
  }


  .illustration{
    min-height:0;

    height:
      min(
        60vh,
        570px
      );
  }


  .text-page{
    min-height:0;

    padding:
      29px
      23px
      33px;
  }


  .navigation{
    flex-wrap:wrap;
  }

  .dots{
    order:3;

    width:100%;
  }

}


/* маленькі телефони */

@media(max-width:520px){

  .book-app{
    padding:
      9px
      9px
      22px;
  }

  .topbar{
    padding:
      11px
      13px;

    flex-direction:column;
    align-items:flex-start;

    margin-bottom:9px;
  }

  .book-name{
    font-size:14px;
  }


  .illustration{
    height:
      49vh;

    min-height:330px;
  }


  .scene-title{
    font-size:28px;
  }


  .story{
    font-size:17px;
    line-height:1.68;
  }


  .questions-list{
    font-size:16px;
  }


  .nav-button{
    flex:1;

    min-width:0;
  }


  .dots{
    display:none;
  }


  .cover-magic-zone{
    width:82px;
    height:82px;
  }

}


/* якщо людина вимкнула анімації */

@media(
  prefers-reduced-motion:
  reduce
){

  *,
  *::before,
  *::after{
    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    scroll-behavior:auto !important;
  }

}

</style>
</head>


<body class="locked">


<div
  id="autumnLayer">
</div>


<!-- =====================================
     ОБКЛАДИНКА
===================================== -->

<section
  class="cover-screen"
  id="coverScreen">

  <div class="cover-column">

    <div
      class="cover-book"
      id="coverBook">

      <img
        src="cover.png"
        alt="Обкладинка книги Рудик і чарівне світло осені"
        class="cover-image">

      <div
        class="cover-gloss">
      </div>

      <button
        class="cover-magic-zone"
        id="coverMagic"
        aria-label="Чарівний листочок">
      </button>

    </div>


    <div
      class="cover-controls">

      <p
        class="cover-message">
        Торкнися чарівного листочка — і книга відкриє свою таємницю ✦
      </p>

      <button
        class="open-button"
        id="openBook">

        Відкрити книгу

      </button>

    </div>

  </div>

</section>


<!-- =====================================
     КНИГА
===================================== -->

<main
  class="book-app hidden"
  id="bookApp">


  <header
    class="topbar">

    <div
      class="book-name">

      Рудик і чарівне світло осені

    </div>

    <div
      class="counter"
      id="counter">

    </div>

  </header>


  <section
    class="book"
    id="book">


    <!-- ІЛЮСТРАЦІЯ -->

    <div
      class="illustration">

      <img
        src="01.jpg"
        alt=""
        id="sceneImage"
        class="scene-image">

      <div
        class="image-shadow">
      </div>


      <button
        id="magicLeaf"
        class="magic-leaf-button hidden-leaf"
        aria-label="Торкнутися чарівного листочка">

        <img
          src="magic-leaf.png"
          alt=""
          class="magic-leaf-image">

      </button>

    </div>


    <!-- ТЕКСТ -->

    <article
      class="text-page">

      <p
        class="page-kicker"
        id="pageKicker">
      </p>

      <h2
        class="scene-title"
        id="sceneTitle">
      </h2>

      <div
        class="story"
        id="story">
      </div>


      <div
        class="questions"
        id="questionsBlock">

        <div
          class="questions-card">

          <h3
            class="questions-title">

            ✦ Після читання

          </h3>

          <ul
            class="questions-list"
            id="questions">
          </ul>

        </div>

      </div>


      <div
        class="magic-pause-text hidden"
        id="magicPause">
      </div>

    </article>

  </section>


  <nav
    class="navigation">

    <button
      class="nav-button"
      id="prev">

      ← Назад

    </button>


    <div
      class="dots"
      id="dots">
    </div>


    <button
      class="nav-button"
      id="next">

      Далі →

    </button>

  </nav>

</main>


<script>


/* =====================================
   СТОРІНКИ
===================================== */


const pages=[


{
  image:"01.jpg",

  kicker:"Сторінка 1",

  title:"Осінній сад Рудика",

/* =====================================
   ЕЛЕМЕНТИ
===================================== */


const coverScreen=
  document.getElementById(
    "coverScreen"
  );

const coverBook=
  document.getElementById(
    "coverBook"
  );

const coverMagic=
  document.getElementById(
    "coverMagic"
  );

const openBookButton=
  document.getElementById(
    "openBook"
  );

const bookApp=
  document.getElementById(
    "bookApp"
  );

const book=
  document.getElementById(
    "book"
  );

const sceneImage=
  document.getElementById(
    "sceneImage"
  );

const magicLeaf=
  document.getElementById(
    "magicLeaf"
  );

const pageKicker=
  document.getElementById(
    "pageKicker"
  );

const sceneTitle=
  document.getElementById(
    "sceneTitle"
  );

const story=
  document.getElementById(
    "story"
  );

const questions=
  document.getElementById(
    "questions"
  );

const questionsBlock=
  document.getElementById(
    "questionsBlock"
  );

const magicPause=
  document.getElementById(
    "magicPause"
  );

const counter=
  document.getElementById(
    "counter"
  );

const prev=
  document.getElementById(
    "prev"
  );

const next=
  document.getElementById(
    "next"
  );

const dots=
  document.getElementById(
    "dots"
  );

const autumnLayer=
  document.getElementById(
    "autumnLayer"
  );


let current=0;



/* =====================================
   КРАПКИ
===================================== */


function makeDots(){

  dots.innerHTML="";

  pages.forEach(
    (_,index)=>{

      const dot=
        document.createElement(
          "button"
        );

      dot.className="dot";

      dot.setAttribute(
        "aria-label",
        `Сторінка ${index+1}`
      );

      if(index===current){
        dot.classList.add(
          "active"
        );
      }

      dot.onclick=()=>{
        current=index;
        render();
      };

      dots.appendChild(dot);

    }
  );

}



/* =====================================
   ВІДОБРАЖЕННЯ СТОРІНКИ
===================================== */


function render(){

  const page=
    pages[current];


  sceneImage.src=
    page.image;

  sceneImage.alt=
    page.title;


  pageKicker.textContent=
    page.kicker;

  sceneTitle.textContent=
    page.title;


  story.innerHTML=
    page.text
    .map(
      paragraph=>
      `<p>${paragraph}</p>`
    )
    .join("");


  questions.innerHTML=
    page.questions
    .map(
      question=>
      `<li>${question}</li>`
    )
    .join("");


  const hasQuestions=
    page.questions.length>0;

  questionsBlock
    .classList
    .toggle(
      "hidden",
      !hasQuestions
    );


  if(page.pause){

    magicPause.textContent=
      page.pause;

    magicPause
      .classList
      .remove(
        "hidden"
      );

  }else{

    magicPause
      .classList
      .add(
        "hidden"
      );

  }


  counter.textContent=
    `${current+1} / ${pages.length}`;


  prev.disabled=
    current===0;


  if(
    current===
    pages.length-1
  ){

    next.textContent=
      "На початок ↺";

  }else{

    next.textContent=
      "Далі →";

  }


  /* листок */

  if(
    page.leaf &&
    page.leaf.show
  ){

    magicLeaf
      .classList
      .remove(
        "hidden-leaf"
      );

    magicLeaf.style.left=
      page.leaf.left+"%";

    magicLeaf.style.top=
      page.leaf.top+"%";

    magicLeaf.style.width=
      page.leaf.size+"px";

    magicLeaf.style.setProperty(
      "--rotation",
      page.leaf.rotation+"deg"
    );

  }else{

    magicLeaf
      .classList
      .add(
        "hidden-leaf"
      );

  }


  /* анімація сторінки */

  book.classList.remove(
    "turn"
  );

  sceneImage.classList.remove(
    "page-enter"
  );

  void book.offsetWidth;

  book.classList.add(
    "turn"
  );

  sceneImage.classList.add(
    "page-enter"
  );


  makeDots();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =====================================
   НАВІГАЦІЯ
===================================== */


prev.onclick=()=>{

  if(current>0){

    current--;

    render();

  }

};


next.onclick=()=>{

  if(
    current<
    pages.length-1
  ){

    current++;

  }else{

    current=0;

  }

  render();

};



/* =====================================
   ЧАРІВНИЙ ЛИСТОЧОК
===================================== */


magicLeaf.onclick=
(event)=>{

  event.stopPropagation();

  const rect=
    magicLeaf
    .getBoundingClientRect();

  sparkleBurst(
    rect.left+
    rect.width/2,

    rect.top+
    rect.height/2,

    30
  );


  magicLeaf
    .classList
    .remove(
      "magic-click"
    );

  void magicLeaf.offsetWidth;

  magicLeaf
    .classList
    .add(
      "magic-click"
    );


  setTimeout(
    ()=>{

      magicLeaf
        .classList
        .remove(
          "magic-click"
        );

    },
    800
  );

};



/* =====================================
   ІСКРИ
===================================== */


function sparkleBurst(
  x,
  y,
  count=24
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const spark=
      document.createElement(
        "span"
      );

    spark.className=
      "spark";

    spark.style.left=
      x+"px";

    spark.style.top=
      y+"px";


    const distance=
      50+
      Math.random()*120;

    const angle=
      Math.random()*
      Math.PI*2;


    spark.style.setProperty(
      "--sx",
      Math.cos(angle)*
      distance+"px"
    );

    spark.style.setProperty(
      "--sy",
      Math.sin(angle)*
      distance+"px"
    );


    document.body
      .appendChild(
        spark
      );


    setTimeout(
      ()=>spark.remove(),
      950
    );

  }

}



/* =====================================
   ОБКЛАДИНКА
===================================== */


function openBook(){

  coverBook
    .classList
    .add(
      "opening"
    );


  createLeaves(7);


  setTimeout(
    ()=>{

      coverScreen
        .classList
        .add(
          "opened"
        );

    },
    380
  );


  setTimeout(
    ()=>{

      coverScreen
        .classList
        .add(
          "hidden"
        );

      bookApp
        .classList
        .remove(
          "hidden"
        );

      document.body
        .classList
        .remove(
          "locked"
        );

      render();

    },
    820
  );

}


openBookButton.onclick=
()=>{

  const rect=
    openBookButton
      .getBoundingClientRect();

  sparkleBurst(
    rect.left+
    rect.width/2,

    rect.top+
    rect.height/2,

    15
  );

  setTimeout(
    openBook,
    170
  );

};


coverMagic.onclick=
()=>{

  const rect=
    coverMagic
      .getBoundingClientRect();

  sparkleBurst(
    rect.left+
    rect.width/2,

    rect.top+
    rect.height/2,

    35
  );

  setTimeout(
    openBook,
    230
  );

};



/* =====================================
   ОСІННЄ ЛИСТЯ
===================================== */


function createLeaves(
  amount=1
){

  const symbols=[
    "🍂",
    "🍁"
  ];


  for(
    let i=0;
    i<amount;
    i++
  ){

    const leaf=
      document.createElement(
        "span"
      );


    leaf.className=
      "fall-leaf";


    leaf.textContent=
      symbols[
        Math.floor(
          Math.random()*
          symbols.length
        )
      ];


    leaf.style.left=
      Math.random()*
      100+"vw";


    leaf.style.fontSize=
      12+
      Math.random()*15+
      "px";


    leaf.style.animationDuration=
      10+
      Math.random()*10+
      "s";


    leaf.style.setProperty(
      "--drift",
      -95+
      Math.random()*190+
      "px"
    );


    autumnLayer
      .appendChild(
        leaf
      );


    setTimeout(
      ()=>leaf.remove(),
      22000
    );

  }

}


/* листя дуже рідке */

setInterval(
  ()=>createLeaves(1),
  4400
);



/* =====================================
   КЛАВІАТУРА
===================================== */


document.addEventListener(
  "keydown",
  event=>{

    if(
      bookApp
      .classList
      .contains(
        "hidden"
      )
    ){
      return;
    }


    if(
      event.key===
      "ArrowRight"
    ){
      next.click();
    }


    if(
      event.key===
      "ArrowLeft"
    ){
      prev.click();
    }

  }
);



/* =====================================
   СТАРТ
===================================== */


makeDots();

</script>
