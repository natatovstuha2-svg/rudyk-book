<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рудик і чарівне світло осені</title>

  <style>
    :root{
      --bg-dark:#160f0b;
      --bg-mid:#2a1a12;
      --gold:#e2b864;
      --gold-soft:#f7dfad;
      --paper:#f7f1e6;
      --paper-2:#efe4d1;
      --text:#3b2a1d;
      --accent:#9f6434;
      --shadow:0 22px 60px rgba(0,0,0,.28);
      --radius:28px;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, rgba(255,214,140,.14), transparent 26%),
        linear-gradient(180deg, #1a120d 0%, #2b1a12 45%, #170f0b 100%);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }

    body.locked{
      overflow:hidden;
    }

    .hidden{
      display:none !important;
    }

    /* =========================
       FALLING LEAVES
    ========================= */

    .ambient-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:5;
    }

    .ambient-leaf{
      position:absolute;
      top:-60px;
      opacity:.55;
      filter:drop-shadow(0 5px 10px rgba(0,0,0,.18));
      animation:fallLeaf linear forwards;
      will-change:transform;
    }

    @keyframes fallLeaf{
      from{
        transform:translate3d(0,0,0) rotate(0deg);
      }
      to{
        transform:translate3d(var(--drift),110vh,0) rotate(360deg);
      }
    }

    .spark{
      position:fixed;
      width:10px;
      height:10px;
      border-radius:50%;
      pointer-events:none;
      z-index:999;
      background:radial-gradient(circle, #fff9da 0%, #ffd77e 55%, rgba(255,184,62,.15) 100%);
      box-shadow:
        0 0 10px rgba(255,245,192,.95),
        0 0 22px rgba(255,191,84,.75);
      animation:sparkFly 900ms ease-out forwards;
    }

    @keyframes sparkFly{
      from{
        opacity:1;
        transform:translate(0,0) scale(1);
      }
      to{
        opacity:0;
        transform:translate(var(--tx),var(--ty)) scale(.18);
      }
    }

    /* =========================
       COVER
    ========================= */

    .cover-screen{
      position:fixed;
      inset:0;
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:
        radial-gradient(circle at center, rgba(255,209,118,.10), transparent 33%),
        linear-gradient(180deg, rgba(10,7,5,.88), rgba(20,12,8,.92));
      transition:opacity .8s ease, visibility .8s ease, transform .8s ease;
    }

    .cover-screen.opening{
      opacity:0;
      visibility:hidden;
      transform:scale(1.02);
    }

    .cover-wrap{
      position:relative;
      width:min(92vw, 760px);
      aspect-ratio:3/4;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .cover-image{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      border-radius:18px;
      box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,220,145,.14);
      user-select:none;
      -webkit-user-drag:none;
    }

    .cover-shine{
      position:absolute;
      inset:0;
      border-radius:18px;
      overflow:hidden;
      pointer-events:none;
    }

    .cover-shine::before{
      content:"";
      position:absolute;
      top:-20%;
      left:-38%;
      width:28%;
      height:140%;
      background:linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,240,191,.14) 42%,
        rgba(255,255,255,.30) 50%,
        rgba(255,239,181,.12) 58%,
        rgba(255,255,255,0) 100%
      );
      transform:rotate(8deg);
      animation:coverSweep 7.2s ease-in-out infinite;
    }

    @keyframes coverSweep{
      0%, 72%{
        left:-42%;
      }
      100%{
        left:120%;
      }
    }

    .cover-leaf-hotspot{
      position:absolute;
      left:50%;
      top:71.5%;
      transform:translate(-50%,-50%);
      width:108px;
      height:108px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      background:
        radial-gradient(circle, rgba(255,245,186,.36) 0%, rgba(255,200,95,.18) 46%, rgba(255,165,47,0) 72%);
      box-shadow:
        0 0 25px rgba(255,206,95,.55),
        0 0 60px rgba(255,179,42,.18);
      animation:leafPulse 2.2s ease-in-out infinite;
    }

    .cover-leaf-hotspot::after{
      content:"🍁";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      opacity:.94;
      filter:drop-shadow(0 0 10px rgba(255,217,111,.95));
    }

    @keyframes leafPulse{
      0%,100%{
        transform:translate(-50%,-50%) scale(1);
      }
      50%{
        transform:translate(-50%,-50%) scale(1.08);
      }
    }

    .cover-caption{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      width:min(92%, 520px);
      text-align:center;
      z-index:2;
    }

    .cover-hint{
      margin:0 0 12px;
      color:#fff3cf;
      font-size:.97rem;
      text-shadow:0 2px 8px rgba(0,0,0,.55);
    }

    .open-book-btn{
      border:none;
      cursor:pointer;
      border-radius:999px;
      padding:15px 28px;
      font-size:1rem;
      font-weight:bold;
      color:#4c3118;
      background:linear-gradient(180deg,#ffe8af 0%,#dfb660 100%);
      box-shadow:
        0 10px 24px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.48);
      transition:transform .2s ease, box-shadow .2s ease;
      font-family:inherit;
    }

    .open-book-btn:hover,
    .open-book-btn:focus-visible{
      transform:translateY(-2px) scale(1.02);
      box-shadow:
        0 14px 28px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.56);
    }

    /* =========================
       MAIN APP
    ========================= */

    .app{
      min-height:100vh;
      padding:18px 18px 28px;
      position:relative;
      z-index:10;
    }

    .topbar{
      width:min(1240px,96vw);
      margin:0 auto 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-radius:18px;
      background:rgba(69,43,25,.58);
      backdrop-filter:blur(8px);
      color:#fff0cd;
      box-shadow:var(--shadow);
    }

    .brand{
      font-weight:bold;
      letter-spacing:.2px;
    }

    .counter{
      color:#f3dca8;
      font-size:.95rem;
    }

    .book-shell{
      width:min(1240px,96vw);
      margin:0 auto;
    }

    .book-page{
      display:grid;
      grid-template-columns:1.02fr .98fr;
      min-height:76vh;
      border-radius:30px;
      overflow:hidden;
      background:linear-gradient(180deg,#f5eee1 0%, #ece0cd 100%);
      box-shadow:0 26px 60px rgba(0,0,0,.30);
    }

    .book-page.turn{
      animation:pageTurn .55s ease;
    }

    @keyframes pageTurn{
      0%{
        opacity:.35;
        transform:scale(.985) rotateY(8deg);
      }
      100%{
        opacity:1;
        transform:scale(1) rotateY(0deg);
      }
    }

    .illustration-pane{
      position:relative;
      overflow:hidden;
      background:#1f160f;
      min-height:420px;
    }

    .illustration-pane img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .35s ease, filter .35s ease;
    }

    .illustration-pane img.alive{
      transform:scale(1.04) rotate(-.6deg);
      filter:brightness(1.04) saturate(1.05);
    }

    .illustration-overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), transparent 22%),
        linear-gradient(0deg, rgba(0,0,0,.20), transparent 25%);
      pointer-events:none;
    }

    .leaf-button{
      position:absolute;
      right:18px;
      top:18px;
      width:60px;
      height:60px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      font-size:1.6rem;
      color:#5e390d;
      background:radial-gradient(circle, #fff4be 0%, #ffd36b 55%, #efa62e 100%);
      box-shadow:
        0 0 22px rgba(255,202,95,.75),
        0 0 50px rgba(255,171,53,.26);
      animation:leafPulse 2.2s ease-in-out infinite;
      font-family:inherit;
    }

    .rudyk-button{
      position:absolute;
      left:18px;
      bottom:18px;
      border:none;
      cursor:pointer;
      border-radius:999px;
      padding:11px 15px;
      font-size:.95rem;
      color:#fff4df;
      background:rgba(51,33,21,.66);
      backdrop-filter:blur(4px);
      box-shadow:0 8px 18px rgba(0,0,0,.22);
      font-family:inherit;
    }

    .tap-hint{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      padding:9px 14px;
      border-radius:999px;
      background:rgba(49,31,20,.56);
      color:#fff0d5;
      font-size:.9rem;
      backdrop-filter:blur(3px);
      max-width:calc(100% - 170px);
      text-align:center;
    }

    .speech{
      position:absolute;
      left:50%;
      bottom:78px;
      transform:translateX(-50%) translateY(10px);
      max-width:76%;
      padding:12px 16px;
      border-radius:18px;
      background:rgba(255,249,236,.96);
      color:#5a3a20;
      box-shadow:0 12px 30px rgba(0,0,0,.26);
      font-size:.98rem;
      text-align:center;
      opacity:0;
      transition:.28s ease;
      pointer-events:none;
    }

    .speech.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .text-pane{
      padding:clamp(24px,3.2vw,40px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.82), rgba(247,241,230,.98)),
        repeating-linear-gradient(
          180deg,
          rgba(0,0,0,0) 0px,
          rgba(0,0,0,0) 29px,
          rgba(124,96,68,.05) 30px
        );
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .kicker{
      margin:0 0 10px;
      color:#936640;
      text-transform:uppercase;
      letter-spacing:1.6px;
      font-size:.85rem;
    }

    .scene-title{
      margin:0 0 18px;
      color:#5c3c22;
      font-size:clamp(1.8rem,2.1vw,2.45rem);
      line-height:1.15;
    }

    .story-text{
      color:#3e2b1f;
      font-size:1.08rem;
      line-height:1.78;
    }

    .story-text p{
      margin:0 0 14px;
    }

    .questions-box{
      margin-top:18px;
      padding:18px 20px;
      border-radius:22px;
      background:rgba(255,248,234,.9);
      border:1px solid rgba(173,128,80,.22);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
    }

    .questions-box h3{
      margin:0 0 12px;
      color:#7f532e;
      font-size:1.12rem;
    }

    .questions-box ul{
      margin:0;
      padding-left:20px;
    }

    .questions-box li{
      margin-bottom:10px;
      line-height:1.55;
    }

    .navigation{
      width:min(1240px,96vw);
      margin:18px auto 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .nav-btn{
      border:none;
      cursor:pointer;
      min-width:132px;
      border-radius:999px;
      padding:13px 20px;
      font-weight:bold;
      font-size:1rem;
      color:#4d2f18;
      background:linear-gradient(180deg,#ffe9b5 0%,#e6c275 100%);
      box-shadow:0 10px 18px rgba(0,0,0,.16);
      transition:transform .2s ease, opacity .2s ease;
      font-family:inherit;
    }

    .nav-btn:hover:not(:disabled),
    .nav-btn:focus-visible:not(:disabled){
      transform:translateY(-2px);
    }

    .nav-btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .dots{
      flex:1;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
    }

    .dot{
      width:12px;
      height:12px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      background:rgba(255,228,170,.42);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
      transition:transform .2s ease, background .2s ease;
    }

    .dot.active{
      background:#ffd17a;
      transform:scale(1.26);
      box-shadow:0 0 10px rgba(255,203,96,.66);
    }

    .final-note{
      margin-top:16px;
      padding:15px 16px;
      border-radius:18px;
      background:rgba(255,242,214,.88);
      color:#6a4321;
      font-style:italic;
      line-height:1.55;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 960px){
      .book-page{
        grid-template-columns:1fr;
      }

      .illustration-pane{
        min-height:340px;
      }

      .navigation{
        flex-wrap:wrap;
      }

      .dots{
        order:3;
        width:100%;
      }
    }

    @media (max-width: 640px){
      .app{
        padding:10px 10px 22px;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
        padding:12px 14px;
      }

      .cover-wrap{
        width:min(96vw, 520px);
      }

      .cover-hint{
        font-size:.92rem;
      }

      .cover-leaf-hotspot{
        width:92px;
        height:92px;
      }

      .illustration-pane{
        min-height:280px;
      }

      .leaf-button{
        width:54px;
        height:54px;
        font-size:1.4rem;
      }

      .rudyk-button{
        font-size:.9rem;
        padding:10px 13px;
      }

      .tap-hint{
        font-size:.82rem;
        left:14px;
        right:14px;
        transform:none;
        max-width:unset;
      }

      .story-text{
        font-size:1rem;
        line-height:1.72;
      }

      .nav-btn{
        flex:1;
        min-width:0;
      }

      .speech{
        max-width:86%;
        font-size:.93rem;
      }
    }
  </style>
</head>
<body class="locked">

  <div id="ambientLayer" class="ambient-layer" aria-hidden="true"></div>

  <!-- COVER -->
  <section id="coverScreen" class="cover-screen">
    <div class="cover-wrap">
      <img class="cover-image" src="cover.png" alt="Обкладинка книги Рудик і чарівне світло осені">
      <div class="cover-shine"></div>

      <button id="coverLeaf" class="cover-leaf-hotspot" aria-label="Чарівний листочок"></button>

      <div class="cover-caption">
        <p class="cover-hint">Натисни на чарівний листочок або кнопку, щоб відкрити книгу ✨</p>
        <button id="openBookBtn" class="open-book-btn">Відкрити книгу</button>
      </div>
    </div>
  </section>

  <!-- APP -->
  <main id="bookApp" class="app hidden">
    <header class="topbar">
      <div class="brand">Рудик і чарівне світло осені</div>
      <div class="counter" id="pageCounter">Сторінка 1 з 10</div>
    </header>

    <section class="book-shell">
      <article id="bookPage" class="book-page">
        <div class="illustration-pane">
          <img id="sceneImage" src="01.jpg" alt="Ілюстрація до сторінки казки">
          <div class="illustration-overlay"></div>

          <button id="sceneLeafBtn" class="leaf-button" aria-label="Створити магію">🍁</button>
          <button id="rudykBtn" class="rudyk-button">🦊 Торкнися Рудика</button>
          <div class="tap-hint">Натисни на чарівний листочок або на Рудика</div>
          <div id="speechBubble" class="speech"></div>
        </div>

        <div class="text-pane">
          <p id="sceneKicker" class="kicker">Сторінка 1</p>
          <h2 id="sceneTitle" class="scene-title">Осінній сад Рудика</h2>

          <div id="sceneText" class="story-text"></div>

          <div class="questions-box">
            <h3>Короткі запитання</h3>
            <ul id="questionList"></ul>
          </div>

          <div id="finalNote" class="final-note hidden">
            Якщо хочеш, натисни <strong>«На початок ↺»</strong> і прочитай казку ще раз.
          </div>
        </div>
      </article>
    </section>

    <footer class="navigation">
      <button id="prevBtn" class="nav-btn">← Назад</button>
      <div id="dots" class="dots"></div>
      <button id="nextBtn" class="nav-btn">Далі →</button>
    </footer>
  </main>

  <script>
    const pages = [
      {
        image: "01.jpg",
        kicker: "Сторінка 1",
        title: "Осінній сад Рудика",
        text: [
          "У самому серці стародавнього саду жило маленьке лисеня на ім’я Рудик. Він був незвичайним лисом, бо понад усе на світі любив осінь.",
          "Кожного ранку Рудик пов’язував свій улюблений синій шарфик і вирушав на прогулянку, щоб послухати, як шелестить під лапками золоте листя. Його хутро було таким же яскравим, як і навколишні дерева."
        ],
        questions: [
          "Як звали маленьке лисеня?",
          "Яку пору року найбільше любив Рудик?",
          "Що він любив слухати під час прогулянки?"
        ],
        speech: "Шурх-шурх... Чуєш, як лагідно говорить осіннє листя?"
      },
      {
        image: "02.jpg",
        kicker: "Сторінка 2",
        title: "Останній чарівний листочок",
        text: [
          "Одного дня Рудик помітив, що дерева стали майже порожніми. Вітер забрав майже все листя, залишивши сад тихим і трохи сумним.",
          "Але на найвищій гілці старого клена він побачив дещо дивовижне. Там висів останній листочок, який не просто жовтів — він сяяв, ніби маленька зірка, що спустилася з неба."
        ],
        questions: [
          "Що сталося з деревами?",
          "Де Рудик побачив чарівний листочок?",
          "На що був схожий сяючий лист?"
        ],
        speech: "Дивись! Він не просто листочок... у ньому є справжня магія."
      },
      {
        image: "03.jpg",
        kicker: "Сторінка 3",
        title: "Листочок Бажань",
        text: [
          "Раптом легкий вітерець підхопив листочок, і той повільно опустився прямо в лапки Рудику. Як тільки лисеня торкнулося його, воно відчуло дивне тепло.",
          "Це був чарівний Листочок Бажань. У лісі казали, що той, хто знайде останній лист, може здійснити будь-яку свою мрію.",
          "Рудик міцно тримав свій скарб, боячись його випустити."
        ],
        questions: [
          "Як чарівний листочок потрапив до Рудика?",
          "Як називався цей лист?",
          "Що міг зробити той, хто його знайде?"
        ],
        speech: "Яке диво... а яке бажання загадав би ти?"
      },
      {
        image: "04.jpg",
        kicker: "Сторінка 4",
        title: "Найважливіше бажання",
        text: [
          "Лисеня почало думати про своє бажання.",
          "«Можливо, я хочу цілу гору солодких ягід? Або щоб мій синій шарфик ніколи не зношувався?» — міркувало воно.",
          "Але чим довше Рудик дивився на чарівний вогник, тим більше розумів, що йому хочеться чогось зовсім іншого, чого не можна просто з’їсти чи вдягнути."
        ],
        questions: [
          "Про які бажання спочатку думав Рудик?",
          "Чому вони перестали здаватися йому найголовнішими?",
          "Як ти гадаєш, чого насправді хотілося Рудику?"
        ],
        speech: "Іноді найголовніше бажання живе не в животі, а в серці."
      },
      {
        image: "05.jpg",
        kicker: "Сторінка 5",
        title: "Сумна дівчинка на містку",
        text: [
          "Неподалік, на дерев’яному містку через струмок, стояла дівчинка на ім’я Мія. Вона нещодавно переїхала до будиночка біля саду і ще не встигла знайти друзів.",
          "Мія сумно дивилася на воду, де плавали поодинокі листочки. Їй було трохи самотньо в цьому великому золотому саду, де вона нікого не знала."
        ],
        questions: [
          "Як звали дівчинку?",
          "Чому Мія почувалася самотньою?",
          "Де саме стояла Мія?"
        ],
        speech: "Мені здається, їй теж бракує когось близького..."
      },
      {
        image: "06.jpg",
        kicker: "Сторінка 6",
        title: "Правильне рішення",
        text: [
          "Рудик побачив Мію і відчув, як його серце підказує правильне рішення. Воно знало, як це — бути одному.",
          "Лисеня обережно почало пробиратися крізь кущі, намагаючись не налякати дівчинку. Сяючий листочок у його лапці освітлював шлях, наче маленький чарівний ліхтарик."
        ],
        questions: [
          "Що підказало Рудику серце?",
          "Чому він добре розумів Мію?",
          "На що був схожий чарівний листочок у його лапці?"
        ],
        speech: "Тихенько... лише б не злякати її."
      },
      {
        image: "07.jpg",
        kicker: "Сторінка 7",
        title: "Перший крок до дружби",
        text: [
          "Мія почула шурхіт і обернулася. Перед нею, прямо на каменях біля містка, стояло пухнасте лисеня.",
          "Воно не втекло, а навпаки — підійшло ближче і простягнуло їй чарівний листочок.",
          "Світло від нього було таким яскравим і теплим, що сум Мії миттєво зник, поступившись місцем справжньому захопленню."
        ],
        questions: [
          "Що зробила Мія, почувши шурхіт?",
          "Що простягнув їй Рудик?",
          "Як змінився настрій дівчинки?"
        ],
        speech: "Не бійся... це для тебе."
      },
      {
        image: "08.jpg",
        kicker: "Сторінка 8",
        title: "Два самотні серця",
        text: [
          "«Це мені?» — тихо запитала Мія.",
          "Рудик кивнув і тихенько ткнувся носом у її руку. Дівчинка обережно взяла листочок за черешок. Тепер вони обидва торкалися магії.",
          "У цей момент вони зрозуміли, що чарівний лист знайшов своє справжнє призначення — поєднати два самотніх серця."
        ],
        questions: [
          "Що запитала Мія?",
          "Як Рудик відповів їй без слів?",
          "Яке справжнє призначення мав чарівний листочок?"
        ],
        speech: "Здається, моє бажання вже здійснилося..."
      },
      {
        image: "09.jpg",
        kicker: "Сторінка 9",
        title: "Мить справжнього дива",
        text: [
          "І в цю мить осінній сад засяяв по-новому. Золоті іскорки закружляли в повітрі, а навколо Мії та Рудика розлилося тепле чарівне світло.",
          "Здавалося, ніби сама осінь усміхнулася їм у відповідь. Так почалося справжнє диво — диво дружби."
        ],
        questions: [
          "Що сталося в осінньому саду?",
          "Яке диво почалося для Рудика і Мії?",
          "Який настрій викликає ця чарівна мить?"
        ],
        speech: "Найтепліше світло народжується там, де є дружба."
      },
      {
        image: "10.jpg",
        kicker: "Сторінка 10",
        title: "Найтепліше світло",
        text: [
          "Тепер кожного дня в осінньому саду можна побачити незвичайну пару: маленьку дівчинку та лисеня в синьому шарфику. Вони разом грають у листі та шукають нові пригоди.",
          "Рудик зрозумів головний секрет: магія стає сильнішою, коли ти ділишся нею з другом. А найтепліше світло — це те, що сяє в очах дорогої тобі істоти."
        ],
        questions: [
          "Кого тепер можна побачити разом у саду?",
          "Який головний секрет зрозумів Рудик?",
          "Що для тебе означає справжня дружба?"
        ],
        speech: "Ходімо! Попереду ще стільки добрих пригод."
      }
    ];

    const coverScreen = document.getElementById("coverScreen");
    const openBookBtn = document.getElementById("openBookBtn");
    const coverLeaf = document.getElementById("coverLeaf");
    const bookApp = document.getElementById("bookApp");

    const bookPage = document.getElementById("bookPage");
    const sceneImage = document.getElementById("sceneImage");
    const sceneKicker = document.getElementById("sceneKicker");
    const sceneTitle = document.getElementById("sceneTitle");
    const sceneText = document.getElementById("sceneText");
    const questionList = document.getElementById("questionList");
    const pageCounter = document.getElementById("pageCounter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dots = document.getElementById("dots");
    const sceneLeafBtn = document.getElementById("sceneLeafBtn");
    const rudykBtn = document.getElementById("rudykBtn");
    const speechBubble = document.getElementById("speechBubble");
    const finalNote = document.getElementById("finalNote");
    const ambientLayer = document.getElementById("ambientLayer");

    let currentPage = 0;

    function buildDots(){
      dots.innerHTML = "";
      pages.forEach((_, index) => {
        const dot = document.createElement("button");
        dot.className = "dot";
        dot.setAttribute("aria-label", `Перейти до сторінки ${index + 1}`);
        dot.addEventListener("click", () => {
          currentPage = index;
          renderPage();
        });
        dots.appendChild(dot);
      });
    }

    function renderPage(){
      const page = pages[currentPage];

      sceneImage.src = page.image;
      sceneImage.alt = page.title;
      sceneKicker.textContent = page.kicker;
      sceneTitle.textContent = page.title;
      sceneText.innerHTML = page.text.map(p => `<p>${p}</p>`).join("");
      questionList.innerHTML = page.questions.map(q => `<li>${q}</li>`).join("");
      pageCounter.textContent = `Сторінка ${currentPage + 1} з ${pages.length}`;

      prevBtn.disabled = currentPage === 0;
      nextBtn.textContent = currentPage === pages.length - 1 ? "На початок ↺" : "Далі →";

      [...dots.children].forEach((dot, index) => {
        dot.classList.toggle("active", index === currentPage);
      });

      finalNote.classList.toggle("hidden", currentPage !== pages.length - 1);

      speechBubble.classList.remove("show");
      sceneImage.classList.remove("alive");

      bookPage.classList.remove("turn");
      void bookPage.offsetWidth;
      bookPage.classList.add("turn");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function sparkleBurst(x, y, count = 20){
      for(let i = 0; i < count; i++){
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.style.left = `${x}px`;
        spark.style.top = `${y}px`;
        spark.style.setProperty("--tx", `${(Math.random() - 0.5) * 180}px`);
        spark.style.setProperty("--ty", `${(Math.random() - 0.5) * 180}px`);
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 900);
      }
    }

    function burstFromElement(el, count = 20){
      const rect = el.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      sparkleBurst(x, y, count);
    }

    function showSpeech(text){
      speechBubble.textContent = text;
      speechBubble.classList.add("show");
      setTimeout(() => {
        speechBubble.classList.remove("show");
      }, 3800);
    }

    function openBook(){
      coverScreen.classList.add("opening");
      setTimeout(() => {
        coverScreen.classList.add("hidden");
        bookApp.classList.remove("hidden");
        document.body.classList.remove("locked");
        createLeaves(6);
        renderPage();
      }, 700);
    }

    openBookBtn.addEventListener("click", () => {
      burstFromElement(openBookBtn, 18);
      setTimeout(openBook, 180);
    });

    coverLeaf.addEventListener("click", () => {
      burstFromElement(coverLeaf, 34);
      setTimeout(openBook, 220);
    });

    prevBtn.addEventListener("click", () => {
      if(currentPage > 0){
        currentPage--;
        renderPage();
      }
    });

    nextBtn.addEventListener("click", () => {
      if(currentPage < pages.length - 1){
        currentPage++;
      } else {
        currentPage = 0;
      }
      renderPage();
    });

    rudykBtn.addEventListener("click", () => {
      sceneImage.classList.add("alive");
      burstFromElement(rudykBtn, 22);
      showSpeech(pages[currentPage].speech);
      setTimeout(() => sceneImage.classList.remove("alive"), 420);
    });

    sceneLeafBtn.addEventListener("click", () => {
      burstFromElement(sceneLeafBtn, 28);
    });

    sceneImage.addEventListener("click", (event) => {
      sparkleBurst(event.clientX, event.clientY, 18);
      sceneImage.classList.add("alive");
      setTimeout(() => sceneImage.classList.remove("alive"), 350);
    });

    document.addEventListener("keydown", (event) => {
      if(!bookApp.classList.contains("hidden")){
        if(event.key === "ArrowRight"){
          nextBtn.click();
        }
        if(event.key === "ArrowLeft"){
          prevBtn.click();
        }
      }
    });

    function createLeaves(amount = 1){
      const symbols = ["🍁","🍂"];
      for(let i = 0; i < amount; i++){
        const leaf = document.createElement("span");
        leaf.className = "ambient-leaf";
        leaf.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        leaf.style.left = `${Math.random() * 100}vw`;
        leaf.style.fontSize = `${14 + Math.random() * 18}px`;
        leaf.style.animationDuration = `${10 + Math.random() * 10}s`;
        leaf.style.setProperty("--drift", `${-100 + Math.random() * 200}px`);
        ambientLayer.appendChild(leaf);
        setTimeout(() => leaf.remove(), 22000);
      }
    }

    buildDots();
    setInterval(() => createLeaves(1), 3800);
  </script>
</body>
</html>
